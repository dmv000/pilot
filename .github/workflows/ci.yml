name: kit-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm run check:registry
      - name: No runtime dependencies (C-no-deps)
        run: node -e "const p=require('./package.json'); if (p.dependencies && Object.keys(p.dependencies).length) { console.error('package.json must not have dependencies'); process.exit(1) }"
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install Claude Code
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "irm https://claude.ai/install.ps1 | iex"
            echo "$USERPROFILE/.local/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://claude.ai/install.sh | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Validate (C-validate)
        shell: bash
        run: claude plugin validate --strict . && claude plugin validate --strict plugin/.claude-plugin/plugin.json
      - name: Install from local marketplace (C-install)
        shell: bash
        run: |
          claude plugin marketplace add ./
          claude plugin install pilot@pilot
          claude plugin list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(!/pilot@pilot/.test(s)){console.error(s);process.exit(1)}})"
      # C-budget needs a logged-in Claude Code (claude plugin details authenticates), so it runs
      # locally before each release (npm run check:release), not here. Measured 2026-10-22: ~688 tokens.
