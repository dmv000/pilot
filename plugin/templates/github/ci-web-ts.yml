# Generated by /pilot:new (template v1). Project-owned: edit freely; /pilot:migrate shows a diff before changing it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly mutation testing (Monday 03:00 UTC)
  workflow_dispatch:
    inputs:
      mutation:
        description: "Run mutation testing now"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: {{checks.full}}
      - run: {{checks.acceptance}}
      - name: Coverage on changed lines (80%)
        if: github.event_name == 'pull_request'
        # The project's "coverage" script must write Cobertura XML to coverage/cobertura-coverage.xml (set up in roadmap step 1).
        run: |
          npm run coverage --if-present
          if [ -f coverage/cobertura-coverage.xml ]; then
            pipx run diff-cover coverage/cobertura-coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
          else
            echo "::error::No coverage/cobertura-coverage.xml. Add a 'coverage' npm script (roadmap step 1)."; exit 1
          fi
  pilot-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: {{pilot_action_ref}}
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --redact --no-banner
  mutation:
    if: github.event_name == 'schedule' || inputs.mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # The project's "mutation" script runs the mutation tester chosen in the stack ADR (for example Stryker).
      - run: npm run mutation
